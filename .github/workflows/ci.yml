name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  postgres:
    runs-on: ubuntu-latest
    continue-on-error: true # live-server suite not yet verified green
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: migro }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready" --health-interval 5s --health-retries 10
    env:
      MIGRO_TEST_DIALECT: postgres
      MIGRO_TEST_DSN: host=localhost user=postgres password=postgres dbname=migro port=5432 sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test -p 1 -count=1 ./...

  mysql:
    runs-on: ubuntu-latest
    continue-on-error: true # live-server suite not yet verified green
    services:
      mysql:
        image: mysql:8
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: migro }
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -proot" --health-interval 5s --health-retries 20
    env:
      MIGRO_TEST_DIALECT: mysql
      MIGRO_TEST_DSN: root:root@tcp(127.0.0.1:3306)/migro?parseTime=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test -p 1 -count=1 ./...
