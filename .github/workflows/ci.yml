name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - uses: golangci/golangci-lint-action@v8
        with: { version: v2.15.0 }
      - run: go vet ./...
      - run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage.out }

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: migro }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready" --health-interval 5s --health-retries 10
    env:
      MIGRO_TEST_DIALECT: postgres
      MIGRO_TEST_DSN: host=localhost user=postgres password=postgres dbname=migro port=5432 sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test -race -p 1 -count=1 ./...

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: migro }
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -proot" --health-interval 5s --health-retries 20
    env:
      MIGRO_TEST_DIALECT: mysql
      MIGRO_TEST_DSN: root:root@tcp(127.0.0.1:3306)/migro?parseTime=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test -race -p 1 -count=1 ./...

  # The jobs below cover dialects that were only unit-tested before. They are
  # non-blocking until each one is confirmed green, then drop continue-on-error.
  mariadb:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      mariadb:
        image: mariadb:11
        env: { MARIADB_ROOT_PASSWORD: root, MARIADB_DATABASE: migro }
        ports: ["3306:3306"]
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-retries 20
    env:
      MIGRO_TEST_DIALECT: mariadb
      MIGRO_TEST_DSN: root:root@tcp(127.0.0.1:3306)/migro?parseTime=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test -race -p 1 -count=1 ./...

  cockroachdb:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      MIGRO_TEST_DIALECT: cockroachdb
      MIGRO_TEST_DSN: host=localhost user=root dbname=defaultdb port=26257 sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: start cockroachdb
        run: |
          docker run -d --name crdb -p 26257:26257 cockroachdb/cockroach:latest-v24.3 start-single-node --insecure
          for i in $(seq 30); do
            docker exec crdb ./cockroach sql --insecure -e 'select 1' >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs crdb; exit 1
      - run: go test -p 1 -count=1 ./...

  sqlserver:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env: { ACCEPT_EULA: "Y", MSSQL_SA_PASSWORD: "Migro_Passw0rd" }
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Migro_Passw0rd -Q 'select 1'"
          --health-interval 10s --health-retries 20
    env:
      MIGRO_TEST_DIALECT: sqlserver
      MIGRO_TEST_DSN: sqlserver://sa:Migro_Passw0rd@localhost:1433?database=master
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test -p 1 -count=1 ./...
